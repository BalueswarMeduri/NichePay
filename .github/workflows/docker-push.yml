name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm install

      - name: Placeholder test
        run: echo "No tests yet — CI structure in place"

  build-and-push:
    needs: build-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.monolith
          push: true
          tags: |
            balumeduri/nichepay:latest
            balumeduri/nichepay:${{ github.sha }}
          cache-from: type=registry,ref=balumeduri/nichepay:buildcache
          cache-to: type=registry,ref=balumeduri/nichepay:buildcache,mode=max