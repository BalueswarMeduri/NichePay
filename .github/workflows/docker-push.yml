name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- CI job ----
  build-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "Repo root:"
          ls -la
          echo "Backend services:"
          ls Backend/

      - name: Placeholder test
        run: echo "No tests yet — CI structure in place"

  # ---- CD job ---- (only runs if CI passes, only on main)
  build-and-push:
    needs: build-check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Monolithic Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.monolith
          push: true
          tags: |
            balumeduri/nichepay:latest
            balumeduri/nichepay:${{ github.sha }}
          cache-from: type=registry,ref=balumeduri/nichepay:buildcache
          cache-to: type=registry,ref=balumeduri/nichepay:buildcache,mode=max